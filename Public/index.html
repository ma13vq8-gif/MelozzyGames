<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melozzy Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ---- Initial loader ---- */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: rgba(26, 21, 18, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #initial-loader .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(244, 162, 97, 0.12);
      border-top: 4px solid #F4A261;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    #initial-loader .text {
      font-family: 'Patrick Hand', cursive;
      color: #F0EBE6;
      font-size: 1.2rem;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    #initial-loader .dots::after {
      content: '...';
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>
  <!-- Initial loader -->
  <div id="initial-loader">
    <div class="spinner"></div>
    <div class="text">Loading <span class="dots"></span></div>
  </div>

  <!-- Main app -->
  <div id="app"></div>
  <script src="/client.js"></script>
</body>
</html>
